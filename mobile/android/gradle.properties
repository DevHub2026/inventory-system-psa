org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# newDsl must remain false: the Flutter Gradle plugin is incompatible with android.newDsl=true on AGP 9.x.
android.newDsl=false
# builtInKotlin must remain false because third-party pub plugins (like connectivity_plus)
# still contain `apply plugin: 'kotlin-android'` in their build.gradle, which AGP 9 rejects when builtInKotlin=true.
android.builtInKotlin=false
