import com.android.Version
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

group = 'dev.steenbakker.mobile_scanner'
version = '1.0-SNAPSHOT'

// NOTE (local fork patch): The upstream buildscript {} block that added
// classpath "org.jetbrains.kotlin:kotlin-gradle-plugin" has been removed.
// That block placed KGP on the global Gradle classpath, which causes:
//   - A Flutter WARNING when android.builtInKotlin=false
//   - A BUILD FAILURE when android.builtInKotlin=true
// AGP 9+ with built-in Kotlin handles Kotlin compilation itself.
// No external KGP classpath dependency is required.
// The upstream allprojects {} block is also removed — repository
// configuration is the responsibility of the consuming project (the app).

apply plugin: 'com.android.library'

// Do not apply 'kotlin-android' plugin.
// AGP 9+ (and Flutter tool) compiles Kotlin files in sourceSets without legacy KGP plugin application,
// eliminating the Flutter warning: "WARNING: Your app uses the following plugins that apply Kotlin Gradle Plugin (KGP)".

android {
    if (project.android.hasProperty("namespace")) {
        namespace = 'dev.steenbakker.mobile_scanner'
    }

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdk = 23
        consumerProguardFiles 'proguard-rules.pro'
    }

    dependencies {
        def useUnbundled = project.findProperty('dev.steenbakker.mobile_scanner.useUnbundled') ?: false
        if (useUnbundled.toBoolean()) {
            // Dynamically downloaded model via Google Play Services
            implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
        } else {
            // Bundled model in app
            implementation 'com.google.mlkit:barcode-scanning:17.3.0'
        }

        implementation 'androidx.camera:camera-lifecycle:1.6.1'
        implementation 'androidx.camera:camera-camera2:1.6.1'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.23.0'

        // Robolectric provides real implementations of the Android framework
        // classes (Rect, Point, ArrayMap) that the stub android.jar throws on.
        // It is JUnit 4 based, so the vintage engine runs it on the JUnit
        // Platform alongside the JUnit 5 tests.
        testImplementation 'org.robolectric:robolectric:4.16.1'
        testImplementation 'junit:junit:4.13.2'
        testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:6.1.2'
    }

    testOptions {
        unitTests.includeAndroidResources = true

        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}

if (project.extensions.findByName("kotlin") != null) {
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }
}