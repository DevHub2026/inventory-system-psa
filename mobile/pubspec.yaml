name: psa_inventory_mobile
description: PSA Inventory Management System - Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP / API
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # QR scanning
  mobile_scanner: ^5.2.3

  # QR generation
  qr_flutter: ^4.1.0

  # Local notifications
  flutter_local_notifications: ^17.2.4

  # Connectivity
  connectivity_plus: ^6.1.1

  # Shared preferences (non-sensitive settings only)
  shared_preferences: ^2.3.3

  # Date/time formatting
  intl: ^0.19.0

  # Image handling
  cached_network_image: ^3.4.1

  # Permission handling
  permission_handler: ^11.3.1

  # Icons
  cupertino_icons: ^1.0.8

  # Fonts — Inter (matches web login page)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
