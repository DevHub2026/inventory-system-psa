<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003DA5" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#sky2)" />

  <!-- Logistics / Inventory Illustration -->
  <g transform="translate(140, 60)">
    <rect x="20" y="100" width="320" height="160" rx="8" fill="#FFFFFF" opacity="0.95" />
    <rect x="20" y="100" width="320" height="30" rx="8" fill="#003DA5" />
    <circle cx="45" cy="115" r="5" fill="#FFD400" />
    <circle cx="65" cy="115" r="5" fill="#E31C23" />
    <circle cx="85" cy="115" r="5" fill="#22C55E" />

    <!-- Isometric boxes representing inventory asset management -->
    <polygon points="120,160 160,140 200,160 160,180" fill="#60A5FA" />
    <polygon points="120,160 160,180 160,225 120,205" fill="#2563EB" />
    <polygon points="160,180 200,160 200,205 160,225" fill="#1D4ED8" />

    <polygon points="180,180 220,160 260,180 220,200" fill="#FCD34D" />
    <polygon points="180,180 220,200 220,245 180,225" fill="#F59E0B" />
    <polygon points="220,200 260,180 260,225 220,245" fill="#D97706" />

    <!-- Checkmark badge -->
    <circle cx="280" cy="160" r="22" fill="#22C55E" />
    <path d="M271,160 L277,166 L290,152" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
